<div class="full-width-image">
  <!-- Slides empilhados (crossfade real) -->
  <img
    *ngFor="let s of slides; let i = index"
    [src]="s.image"
    class="slide"
    [class.active]="i === currentIndex"
    [attr.aria-hidden]="i !== currentIndex"
    alt="Slide"
  />

  <!-- Conteúdo -->
  <div class="hero-content" [class.content-fade]="isTextAnimating">
    <h1 class="hero-title" [innerHTML]="slides[currentIndex].titleHtml"></h1>

    <p class="hero-subtitle">
      {{ slides[currentIndex].description }}
    </p>

    <button
      type="button"
      class="hero-btn"
      [routerLink]="slides[currentIndex].link"
    >
      {{ slides[currentIndex].buttonText || 'Começar agora' }}
    </button>
  </div>
</div>
