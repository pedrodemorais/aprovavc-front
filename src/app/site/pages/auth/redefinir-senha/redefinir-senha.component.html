<div class="page-redefinir">



  <!-- CONTEÚDO CENTRAL -->
  <main class="redefinir-main">
    <section class="redefinir-card">
      <div class="brand">
        <a routerLink="/home" class="logo-link">
      <img class="logo" src="assets/img/logo/aprovavc.png" alt="AprovaVC">
      
    </a>
        <h2 class="card-title">🔑 Redefinir senha</h2>
        <p class="card-subtitle">
          Escolha uma nova senha para acessar sua conta com segurança.
        </p>
      </div>

      <!-- Mensagens gerais -->
      <div *ngIf="mensagem" class="mensagem mensagem-info">
        {{ mensagem }}
      </div>

      <div *ngIf="erro" class="mensagem mensagem-erro">
        {{ erro }}
      </div>

      <!-- Formulário só aparece se não houver erro -->
      <form *ngIf="!erro" class="redefinir-form" (ngSubmit)="redefinirSenha()">
        <div class="input-group">
          <label for="novaSenha">Nova senha</label>
          <input
            type="password"
            id="novaSenha"
            name="novaSenha"
            [(ngModel)]="novaSenha"
            placeholder="Digite sua nova senha"
            required
          />
        </div>

        <button type="submit" class="btn-confirmar">
          Alterar senha
        </button>
      </form>

      <a routerLink="/login" class="voltar-link">
        Voltar ao login
      </a>
    </section>
  </main>
</div>
