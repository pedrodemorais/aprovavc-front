<div class="page-recuperar">

  <!-- TOPO -->


  <!-- CONTEÚDO CENTRAL -->
  <main class="recuperar-main">
    <section class="recuperar-card">
      <div class="card-header">
        <div class="card-logo">
          <img src="assets/img/logo/aprovavc.png" alt="Aprovavc">
        </div>
        <h2 class="card-title">🔑 Esqueceu sua senha?</h2>
        <p class="card-subtitle">
          Informe seu e-mail para receber o link de recuperação de senha.
        </p>
      </div>

      <form (ngSubmit)="onSubmit()" class="recuperar-form">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="seuemail@exemplo.com"
          />
        </div>

        <button type="submit" class="btn-enviar">
          Enviar link de recuperação
        </button>

        <!-- Mensagens -->
        <div *ngIf="mensagemSucesso" class="mensagem mensagem-sucesso">
          {{ mensagemSucesso }}
        </div>

        <div *ngIf="mensagemErro" class="mensagem mensagem-erro">
          {{ mensagemErro }}
        </div>
      </form>

      <a routerLink="/login" class="voltar-link">
        Voltar ao login
      </a>
    </section>
  </main>
</div>
