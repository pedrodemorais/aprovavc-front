<div class="login-page">

  <div class="login-card">

    <div class="login-header">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/img/logo/dynamo.png" alt="Logo AprovaVC" />
   
      </div>

      <a routerLink="/home" class="login-back">&larr; Voltar para o site</a>
    </div>

    <div class="login-welcome">
      <h1>Entre na sua conta</h1>
      <p>Estude com foco, acompanhe seu progresso e retome de onde parou.</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <!-- Mensagem de sucesso -->
      <div *ngIf="mensagem" class="alert alert-success">
        {{ mensagem }}
      </div>

      <!-- Mensagem de erro -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>
    </form>

    <div class="login-links">
      <a routerLink="/recuperar-senha" class="link-inline">
        Esqueceu a senha?
