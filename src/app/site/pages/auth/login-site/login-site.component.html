<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/img/logo/revizo.png" alt="Logo" />
      </div>
    </div>

 

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-field">
          <input
            id="password"
            class="password-input"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Digite sua senha"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
            <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <a routerLink="/recuperar-senha" class="link-inline">
          Esqueceu a senha?
        </a>
      </div>

      <!-- Mensagem de sucesso -->
      <div *ngIf="mensagem" class="alert alert-success">
        {{ mensagem }}
      </div>

      <!-- Mensagem de erro -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>
    </form>

    <a href="/" class="login-back-inline">Voltar para o site</a>

    <div class="login-links">
     

      <div class="divider"></div>

      <p class="no-account">
        Ainda não tem conta?
        <a routerLink="/configurador" class="link-strong">Criar agora</a>
      </p>
    </div>

  </div>
</div>
