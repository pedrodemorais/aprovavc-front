<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo-wrap">
        <img class="login-logo" src="assets/img/logo/dynamo.png" alt="Logo" />
      </div>

    <a href="/" class="login-back">Voltar para o site</a>

    </div>

    <div class="login-welcome">
      <h1>Entre na sua conta</h1>
      <p>Estude com foco, acompanhe seu progresso e retome de onde parou.</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="seu@email.com"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
        />
      </div>

      <!-- Mensagem de sucesso -->
      <div *ngIf="mensagem" class="alert alert-success">
        {{ mensagem }}
      </div>

      <!-- Mensagem de erro -->
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>
    </form>

    <div class="login-links">
      <a routerLink="/recuperar-senha" class="link-inline">
        Esqueceu a senha?
      </a>

      <div class="divider"></div>

      <p class="no-account">
        Ainda não tem conta?
        <a routerLink="/configurador" class="link-strong">Criar agora</a>
      </p>
    </div>

  </div>
</div>
