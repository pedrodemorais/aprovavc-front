<div class="resumo-page">
  <div class="resumo-shell">
    <header class="resumo-hero">
      <div class="hero-top">
        <div class="hero-title">
          <h1>{{ topico?.descricao || 'Resumo de revisão' }}</h1>
          <p class="hero-materia" *ngIf="materia?.nome">Matéria: {{ materia?.nome }}</p>
        </div>
        <div class="hero-counter" aria-label="Progresso da fila">{{ progressoFilaLabel }}</div>
      </div>

      <div class="hero-progress" aria-hidden="true">
        <div class="hero-progress-fill" [style.width.%]="progressoPercentual"></div>
      </div>

    </header>

    <div class="resumo-body">
      <div class="estado" *ngIf="carregando">Carregando fila de revisão...</div>
      <div class="estado" *ngIf="!carregando && carregandoResumo">Carregando conteúdo...</div>
      <div class="estado estado-erro" *ngIf="!carregando && !carregandoResumo && erro">{{ erro }}</div>
      <div class="estado" *ngIf="!carregando && !carregandoResumo && !erro && !anotacoesHtml">
        Nenhum resumo encontrado.
      </div>

      <article class="resumo-conteudo" *ngIf="!carregando && !carregandoResumo && !erro && anotacoesHtml">
        <div class="conteudo-inner" [innerHTML]="anotacoesHtml"></div>
      </article>

      <footer class="resumo-footer-nav" *ngIf="!carregando && !carregandoResumo && !erro && resumos.length">
        <button type="button" class="btn-nav btn-nav--ghost" (click)="irAnterior()" [disabled]="!podeIrAnterior">
          Voltar
        </button>
        <button type="button" class="btn-nav btn-nav--primary" (click)="irProximo()" [disabled]="!podeIrProximo">
          Avançar
        </button>
      </footer>
    </div>
  </div>
</div>
